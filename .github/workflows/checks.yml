name: Checks

# The factory's first brake, run where nobody's machine can disagree.
#
# It runs `npm run check`, the same script a developer or an agent runs
# locally, and then the production build. To add a check, add it to the
# `check` script in package.json: CI picks it up without changing this file.
#
# SAFE ON A PUBLIC REPO
#   `pull_request` runs fork PRs without this repo's secrets, and the token
#   below can only read. Never switch this to `pull_request_target`: that runs
#   with secrets and a write token, and a fork controls the code it checks out.
#   https://securitylab.github.com/resources/github-actions-preventing-pwn-requests/

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A newer push to the same PR makes the older run pointless.
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    # The branch rule on main requires this name. Rename both together.
    name: checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Checks
        run: npm run check

      - name: Build
        run: npm run build
